<!DOCTYPE html>
<html lang="en">
<head>
    
    
    <title>Project</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        a {
            color: white;
            text-decoration: none;
        }

        body {
            margin: 0;
            overflow: hidden;
            background: black;
        }
        .background-img{
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }
        
        
        .wallpaper{
            width:100%;
            height: 100%;
            top: 0;
            left: 0;
            
            object-fit: cover;
            display: block;
        }
        .heading{
            color: whitesmoke ;
            display: inline-block;
            position: absolute;
            
            top: 7%;
            left: 25%;
            transform: translate(-50%, -50%);
            font-size: 60px;
            font-weight: 400px;
            
            margin-top: 0px;
            margin-bottom: 0px;

        }
        .press-start-2p-regular {
        font-family: "Press Start 2P", system-ui;
        font-weight: 400;
        font-style: normal;
        }
        .mainheading{
            color: red;

        }
        .logo{
            width: 70px;
            height: 70px;
            position: absolute;
            font-size: px;
            top: 6%;
            left: 5%;
            transform: translate(-50%, -50%);
            border-radius: 40px;
            border-bottom: 10px;
            border-top: 10px;
            border-left: 10px;
            border-right: 10px;
            border-color: red;
        }
        .elements{
            display: flex;
            flex-direction: row;
            position: absolute;
            top: 5%;
            left: 87%;
            transform: translate(-50%, -50%);
            color: white;
            
            font-size: 15px;
            font-family: Arial, Helvetica, sans-serif;
            gap: 20px;
            align-items: center;
        
        }
       .elements :hover{
        color: red;

       }
       .elements p{
        margin: 0px;
        white-space: nowrap;
       }
       .home{
        color: red;
       }
       .middle-text{
        position: absolute;
        top: 50%;
        left: 25%;
        transform: translate(-50%, -50%);
        font-family: "Bangers", cursive;
        color: grey;
        font-size: 35px;
        white-space: nowrap;
        animation: slideIn 2s ease-out;


        
    }

    @keyframes slideIn {
        from {
            transform: translate(-150%, -50%);
        }

        to {
            transform: translate(-50%, -50%);
        }
    }
    h2{
        color: red;
        margin-top: 7px;
        margin-bottom: 15px;
    }
    .unleash{
        color: whitesmoke;
    }
    .shop{
        position: absolute;
        top: 78%;
        left: 87%;
        transform: translate(-50%, -50%);
        border-radius: 30px;
        margin-top: 40px;
        font-weight: bold;
        display: inline-block;

        padding: 15px 40px;

        color: white;
        background:black;

        font-family: "Press Start 2P", sans-serif;
        font-size: 14px;

        text-decoration: none;

        border: 2px solid red;

        transition: 0.3s;


    }
    .shop:hover {
        background: transparent;
        color: red;
        box-shadow: 0 0 15px red;
        background-color: black;

        
    }
    .games{
        position: absolute;
        top: 70%;
        left: 87%;
        transform: translate(-50%, -50%);
        border-radius: 30px;
        margin-top: 40px;
        font-weight: bold;
        display: inline-block;

        padding: 15px 55px;

        color: white;
        background:black;

        font-family: "Press Start 2P", sans-serif;
        font-size: 14px;

        text-decoration: none;

        border: 2px solid red;

        transition: 0.3s;

    }
    .games:hover{
        background: transparent;
        color: red;
        box-shadow: 0 0 15px red;
        background-color: black;
        
    }
    /* Mobile screen */
@media (max-width: 600px){

    .background-img{
        height: 100vh;
        width: 100%;
    }

    .wallpaper{
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
    }

    /* GAMEGEAR heading */
    .heading{
        top: 7%;
        left: 28%;
        transform: translate(-50%, -50%);
        font-size: 25px;
        white-space: nowrap;
    }

    /* Logo */
    .logo{
        width: 45px;
        height: 45px;
        top: 7%;
        left: 7%;
    }

    /* Navigation */
    .elements{
        top: 12%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 90%;
        justify-content: center;
        gap: 12px;
        font-size: 9px;
    }

    /* Middle text */
    .middle-text{
        top: 45%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 90%;
        text-align: center;
        font-size: 18px;
        white-space: normal;
    }

    .middle-text h2{
        margin: 10px 0;
    }

    /* Shop button */
    .shop{
        top: 75%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 10px;
        padding: 12px 25px;
        margin: 0;
        white-space: nowrap;
    }
}    </style>
</head>

<body>
    
    
    <div class="background-img">
        <img class="wallpaper"   src="projectimg/projectmain.png">
        <img class="logo" src="projectimg/logo.png">
        <div>
            <h1 class="heading press-start-2p-regular">GAME<span class="mainheading">GEAR</span></h1>
            
        </div>
        <div class="elements">
        <p class="home" > ⌂ HOME </p>
        <p ><a href="products.html">PRODUCTS</a></p>
        <p class="cart" ><a href="cart.html">🛒 CART</a></p>
        <p class="cart"><a href="login.html">LOGIN</a> </p>
        </div>
        <div class="middle-text">
            <h2 class="gear">--GEAR UP.GAME ON--</h2>
            <h2 class="unleash">.UNLEASH YOUR 
             GAMING POTENTIALS.</h2>
            <h2>++DOMINATE THE GAME.</h2>
        </div>
        <button class="shop"><a href="products.html">SHOP NOW</a></button>
        <button class = "games"><a href="games/games.html">GAMES</a></button>
        
    </div>
    
</body>
</html>
