<!DOCTYPE html>
<html lang="en">
<head>
    <title>GAMEGEAR - Login</title>

    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            background-color: #111;
            font-family: Arial, Helvetica, sans-serif;
        }

        .login-box {
            width: 350px;
            padding: 30px;
            background-color: #1c1c1c;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 2px solid red;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
            color: white;
            font-family: "Press Start 2P", sans-serif;
            font-size: 25px;
            margin-bottom: 30px;
        }

        h1 span {
            color: red;
        }

        label {
            color: white;
            display: block;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #555;
            border-radius: 5px;
            background-color: #333;
            color: white;
            box-sizing: border-box;
        }

        input:focus {
            border-color: red;
            outline: none;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background-color: red;
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background-color: darkred;
        }

        .back {
            text-align: center;
            margin-top: 20px;
        }

        .back a {
            color: white;
            text-decoration: none;
        }

        .back a:hover {
            color: red;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>GAME<span>GEAR</span></h1>

        <form>
            <label>Email</label>
            <input type="email" placeholder="Enter your email">

            <label>Password</label>
            <input type="password" placeholder="Enter your password">

            <button class="login-btn" type="submit">LOGIN</button>
        </form>

        <div class="back">
            <a href="project.html">← Back to Home</a>
        </div>

    </div>

</body>
</html>
